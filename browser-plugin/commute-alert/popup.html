<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  body { width: 340px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header button { background: transparent; color: #fff; border-color: rgba(255,255,255,.25); padding: 4px 9px; }
  main { padding: 10px; display: grid; gap: 10px; }
  .trip { border: 1px solid var(--line); border-left: 6px solid var(--level, var(--line)); border-radius: 8px; padding: 10px 12px; background: var(--field); }
  .trip h2 { font-size: 13px; margin: 0; font-weight: 600; }
  .trip .where { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leave { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 2px; }
  .leave strong { font-size: 30px; line-height: 1; font-weight: 700; letter-spacing: -0.5px; }
  .leave span { color: var(--muted); font-size: 12px; }
  .status { font-size: 12.5px; }
  .status b { color: var(--level); }
  .meta { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .err { color: var(--stop); font-size: 12px; margin-top: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .row button { font-size: 12px; padding: 4px 10px; }
  .empty { padding: 18px 12px; text-align: center; color: var(--muted); }
  .empty button { margin-top: 10px; }
</style>
</head>
<body>
  <header class="road">
    <h1>Commute Alert</h1>
    <button id="settings" title="Settings">Settings</button>
  </header>
  <main id="list"></main>
  <script src="popup.js"></script>
</body>
</html>
